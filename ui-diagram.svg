<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="'Courier New', Courier, monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="580" fill="#0f0f0f"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#7fff7f" font-size="17" font-weight="bold" filter="url(#glow)">Spotify G2 — Even Realities G2 UI</text>
  <text x="550" y="56" text-anchor="middle" fill="#4a9a4a" font-size="10.5">576 × 288 px · 4-bit greyscale · tab-based navigation</text>

  <!-- ══════════════ TAB 1: NOW PLAYING ══════════════ -->
  <text x="180" y="88" text-anchor="middle" fill="#7fff7f" font-size="12" font-weight="bold">TAB 1</text>
  <text x="180" y="103" text-anchor="middle" fill="#5fdf5f" font-size="11">Now Playing</text>

  <!-- Lens frame -->
  <rect x="28" y="115" width="304" height="172" rx="16" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="30" y="117" width="300" height="168" rx="14" fill="#0a160a"/>
  <rect x="40" y="127" width="280" height="148" rx="6" fill="none" stroke="#2a5a2a" stroke-width="1.5"/>

  <!-- Tab bar -->
  <rect x="44" y="131" width="120" height="14" rx="3" fill="#1e401e"/>
  <text x="50" y="142" fill="#9fff9f" font-size="9.5" filter="url(#glow)">[♪ Now Playing]</text>
  <text x="174" y="142" fill="#3a6a3a" font-size="9.5">  Playlists</text>
  <line x1="44" y1="146" x2="312" y2="146" stroke="#2a5a2a" stroke-width="1"/>

  <!-- Now Playing content -->
  <g font-size="10.5" filter="url(#glow)">
    <text x="50" y="161" fill="#9fff9f">Blinding Lights</text>
    <text x="50" y="174" fill="#5fdf5f">The Weeknd</text>
    <text x="50" y="193" fill="#7fff7f">▶ Playing</text>
    <text x="50" y="213" fill="#3a6a3a" font-size="9">Tap=Play/Pause  ↑Prev  ↓Next</text>
    <text x="50" y="226" fill="#3a6a3a" font-size="9">D-Tap → Playlists tab</text>
  </g>

  <!-- Gesture legend -->
  <g fill="#444" font-size="9" text-anchor="middle">
    <text x="75"  y="308">TAP</text>
    <text x="180" y="308">D-TAP</text>
    <text x="285" y="308">↑ / ↓</text>
    <text x="75"  y="320" fill="#3a7a3a">Play / Pause</text>
    <text x="180" y="320" fill="#3a7a3a">→ Playlists tab</text>
    <text x="285" y="320" fill="#3a7a3a">Prev / Next</text>
  </g>

  <!-- ══════════════ TAB 2: PLAYLISTS ══════════════ -->
  <text x="550" y="88" text-anchor="middle" fill="#7fff7f" font-size="12" font-weight="bold">TAB 2</text>
  <text x="550" y="103" text-anchor="middle" fill="#5fdf5f" font-size="11">Playlists</text>

  <!-- Lens frame -->
  <rect x="398" y="115" width="304" height="172" rx="16" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="400" y="117" width="300" height="168" rx="14" fill="#0a160a"/>
  <rect x="410" y="127" width="280" height="148" rx="6" fill="none" stroke="#2a5a2a" stroke-width="1.5"/>

  <!-- Tab bar -->
  <text x="420" y="142" fill="#3a6a3a" font-size="9.5">  Now Playing</text>
  <rect x="506" y="131" width="88" height="14" rx="3" fill="#1e401e"/>
  <text x="510" y="142" fill="#9fff9f" font-size="9.5" filter="url(#glow)">[≡ Playlists]</text>
  <line x1="414" y1="146" x2="682" y2="146" stroke="#2a5a2a" stroke-width="1"/>

  <!-- Playlists content -->
  <g font-size="10.5">
    <rect x="414" y="148" width="270" height="13" fill="#1a3a1a" rx="2"/>
    <text x="418" y="159" fill="#9fff9f" filter="url(#glow)">▶ Discover Weekly</text>
    <text x="418" y="172" fill="#5fdf5f">  Liked Songs</text>
    <text x="418" y="185" fill="#5fdf5f">  Chill Vibes</text>
    <text x="418" y="198" fill="#5fdf5f">  Rock Classics</text>
    <text x="418" y="211" fill="#5fdf5f">  Morning Mix</text>
    <text x="418" y="224" fill="#2d6a2d" font-size="9">  1–5 of 12</text>
    <text x="418" y="237" fill="#3a6a3a" font-size="9">Tap=Open  D-Tap→Now Playing  ↑↓</text>
  </g>

  <!-- Gesture legend -->
  <g fill="#444" font-size="9" text-anchor="middle">
    <text x="450" y="308">TAP</text>
    <text x="550" y="308">D-TAP</text>
    <text x="650" y="308">↑ / ↓</text>
    <text x="450" y="320" fill="#3a7a3a">Open playlist</text>
    <text x="550" y="320" fill="#3a7a3a">→ Now Playing tab</text>
    <text x="650" y="320" fill="#3a7a3a">Scroll list</text>
  </g>

  <!-- ══════════════ DRILL-DOWN: TRACKS ══════════════ -->
  <text x="920" y="88" text-anchor="middle" fill="#7fff7f" font-size="12" font-weight="bold">DRILL-DOWN</text>
  <text x="920" y="103" text-anchor="middle" fill="#5fdf5f" font-size="11">Track List</text>

  <!-- Lens frame -->
  <rect x="768" y="115" width="304" height="172" rx="16" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="770" y="117" width="300" height="168" rx="14" fill="#0a160a"/>
  <rect x="780" y="127" width="280" height="148" rx="6" fill="none" stroke="#2a5a2a" stroke-width="1.5"/>

  <!-- Back header -->
  <text x="786" y="142" fill="#5fdf5f" font-size="9.5" filter="url(#glow)">← Discover Weekly</text>
  <line x1="784" y1="146" x2="1052" y2="146" stroke="#2a5a2a" stroke-width="1"/>

  <!-- Track list content -->
  <g font-size="10.5">
    <text x="786" y="159" fill="#5fdf5f">  Starboy</text>
    <text x="786" y="172" fill="#5fdf5f">  Save Your Tears</text>
    <rect x="784" y="174" width="270" height="13" fill="#1a3a1a" rx="2"/>
    <text x="786" y="185" fill="#9fff9f" filter="url(#glow)">▶ After Hours</text>
    <text x="786" y="198" fill="#5fdf5f">  Die For You</text>
    <text x="786" y="211" fill="#5fdf5f">  Sacrifice</text>
    <text x="786" y="224" fill="#2d6a2d" font-size="9">  1–5 of 24</text>
    <text x="786" y="237" fill="#3a6a3a" font-size="9">Tap=Play  D-Tap=Back  ↑↓ Move</text>
  </g>

  <!-- Gesture legend -->
  <g fill="#444" font-size="9" text-anchor="middle">
    <text x="830"  y="308">TAP</text>
    <text x="920"  y="308">D-TAP</text>
    <text x="1010" y="308">↑ / ↓</text>
    <text x="830"  y="320" fill="#3a7a3a">Play track</text>
    <text x="920"  y="320" fill="#3a7a3a">← Back to Playlists</text>
    <text x="1010" y="320" fill="#3a7a3a">Scroll list</text>
  </g>

  <!-- ══════════════ NAVIGATION ARROWS ══════════════ -->

  <!-- D-TAP: Now Playing ↔ Playlists (peer tabs) -->
  <g stroke="#5fdf5f" fill="#5fdf5f">
    <!-- → right: NP to PL -->
    <line x1="334" y1="195" x2="396" y2="195" stroke-width="1.5"/>
    <polygon points="396,191 404,195 396,199"/>
    <text x="365" y="190" text-anchor="middle" fill="#5fdf5f" font-size="8.5">D-TAP</text>
    <!-- ← left: PL to NP -->
    <line x1="396" y1="210" x2="334" y2="210" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="334,206 326,210 334,214"/>
    <text x="365" y="225" text-anchor="middle" fill="#5fdf5f" font-size="8.5">D-TAP</text>
  </g>

  <!-- TAP: Playlists → Tracks (drill-down) -->
  <g stroke="#3a7a3a" fill="#3a7a3a">
    <line x1="704" y1="195" x2="766" y2="195" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="766,191 774,195 766,199"/>
    <text x="735" y="190" text-anchor="middle" fill="#3a7a3a" font-size="8.5">TAP</text>
  </g>

  <!-- D-TAP: Tracks → Playlists (back) -->
  <g stroke="#555" fill="#555">
    <line x1="766" y1="210" x2="704" y2="210" stroke-width="1.2" stroke-dasharray="3,3"/>
    <polygon points="704,206 696,210 704,214"/>
    <text x="735" y="225" text-anchor="middle" fill="#555" font-size="8">D-TAP back</text>
  </g>

  <!-- TAP: Tracks → Now Playing (play track, long arc) -->
  <path d="M 920 115 Q 920 72 550 72 Q 180 72 180 115"
        fill="none" stroke="#7fff7f" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#glow)"/>
  <polygon points="176,115 180,105 184,115" fill="#7fff7f"/>
  <text x="550" y="66" text-anchor="middle" fill="#7fff7f" font-size="9" filter="url(#glow)">TAP (play track) → auto-switches to Now Playing tab + starts playback</text>

  <!-- ══════════════ SETUP STEPS ══════════════ -->
  <text x="550" y="358" text-anchor="middle" fill="#444" font-size="10.5" font-weight="bold">SETUP</text>

  <g font-size="9.5" text-anchor="middle">
    <rect x="30"  y="368" width="148" height="40" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="202" y="368" width="148" height="40" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="374" y="368" width="148" height="40" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="546" y="368" width="148" height="40" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="718" y="368" width="166" height="40" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="908" y="368" width="160" height="40" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>

    <text x="104"  y="383" fill="#5fdf5f">1. Spotify Dev Dashboard</text>
    <text x="104"  y="397" fill="#4a8a4a">get Client ID + Secret</text>

    <text x="276"  y="383" fill="#5fdf5f">2. cp .env.example .env</text>
    <text x="276"  y="397" fill="#4a8a4a">fill in credentials</text>

    <text x="448"  y="383" fill="#5fdf5f">3. npm install</text>
    <text x="448"  y="397" fill="#4a8a4a">npm run dev</text>

    <text x="620"  y="383" fill="#5fdf5f">4. Open browser →</text>
    <text x="620"  y="397" fill="#4a8a4a">localhost:3001/auth/login</text>

    <text x="801"  y="383" fill="#5fdf5f">5. npm run qr</text>
    <text x="801"  y="397" fill="#4a8a4a">scan with Even Hub app</text>

    <text x="988"  y="383" fill="#7fff7f">6. Enjoy ♪</text>
    <text x="988"  y="397" fill="#4a8a4a">Spotify on your glasses</text>

    <line x1="180" y1="388" x2="200" y2="388" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="200,384 208,388 200,392" fill="#2a5a2a"/>
    <line x1="352" y1="388" x2="372" y2="388" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="372,384 380,388 372,392" fill="#2a5a2a"/>
    <line x1="524" y1="388" x2="544" y2="388" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="544,384 552,388 544,392" fill="#2a5a2a"/>
    <line x1="696" y1="388" x2="716" y2="388" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="716,384 724,388 716,392" fill="#2a5a2a"/>
    <line x1="886" y1="388" x2="906" y2="388" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="906,384 914,388 906,392" fill="#2a5a2a"/>
  </g>

  <!-- ══════════════ GESTURE SUMMARY ══════════════ -->
  <text x="550" y="435" text-anchor="middle" fill="#444" font-size="10.5" font-weight="bold">GESTURE SUMMARY</text>

  <rect x="100" y="444" width="900" height="110" rx="8" fill="#0a0f0a" stroke="#1e3a1e" stroke-width="1"/>

  <g font-size="10" fill="#5fdf5f">
    <!-- Headers -->
    <text x="200" y="462" text-anchor="middle" fill="#7fff7f" font-weight="bold">Now Playing tab</text>
    <text x="550" y="462" text-anchor="middle" fill="#7fff7f" font-weight="bold">Playlists tab</text>
    <text x="880" y="462" text-anchor="middle" fill="#7fff7f" font-weight="bold">Track list</text>

    <line x1="370" y1="444" x2="370" y2="554" stroke="#1e3a1e" stroke-width="1"/>
    <line x1="720" y1="444" x2="720" y2="554" stroke="#1e3a1e" stroke-width="1"/>

    <!-- Now Playing gestures -->
    <text x="120" y="481" fill="#4a8a4a">TAP</text>
    <text x="240" y="481">Play / Pause</text>
    <text x="120" y="499" fill="#4a8a4a">D-TAP</text>
    <text x="240" y="499">Switch to Playlists tab</text>
    <text x="120" y="517" fill="#4a8a4a">↑ swipe</text>
    <text x="240" y="517">Previous track</text>
    <text x="120" y="535" fill="#4a8a4a">↓ swipe</text>
    <text x="240" y="535">Next track</text>

    <!-- Playlists gestures -->
    <text x="390" y="481" fill="#4a8a4a">TAP</text>
    <text x="500" y="481">Open → track list</text>
    <text x="390" y="499" fill="#4a8a4a">D-TAP</text>
    <text x="500" y="499">Switch to Now Playing tab</text>
    <text x="390" y="517" fill="#4a8a4a">↑ swipe</text>
    <text x="500" y="517">Scroll up</text>
    <text x="390" y="535" fill="#4a8a4a">↓ swipe</text>
    <text x="500" y="535">Scroll down</text>

    <!-- Tracks gestures -->
    <text x="740" y="481" fill="#4a8a4a">TAP</text>
    <text x="840" y="481">Play → Now Playing tab</text>
    <text x="740" y="499" fill="#4a8a4a">D-TAP</text>
    <text x="840" y="499">Back to Playlists</text>
    <text x="740" y="517" fill="#4a8a4a">↑ swipe</text>
    <text x="840" y="517">Scroll up</text>
    <text x="740" y="535" fill="#4a8a4a">↓ swipe</text>
    <text x="840" y="535">Scroll down</text>
  </g>
</svg>
