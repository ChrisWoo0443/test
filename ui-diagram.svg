<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="'Courier New', Courier, monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Glass lens shape -->
    <clipPath id="lens1"><rect x="30" y="120" width="300" height="160" rx="14"/></clipPath>
    <clipPath id="lens2"><rect x="400" y="120" width="300" height="160" rx="14"/></clipPath>
    <clipPath id="lens3"><rect x="770" y="120" width="300" height="160" rx="14"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" fill="#0f0f0f"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" fill="#7fff7f" font-size="18" font-weight="bold" filter="url(#glow)">Spotify G2 — Even Realities G2 UI</text>
  <text x="550" y="62" text-anchor="middle" fill="#4a9a4a" font-size="11">576 × 288 px · 4-bit greyscale · single built-in font</text>

  <!-- ═══════════════════ SCREEN 1: NOW PLAYING ═══════════════════ -->
  <!-- Label -->
  <text x="180" y="100" text-anchor="middle" fill="#7fff7f" font-size="13" font-weight="bold">NOW PLAYING</text>

  <!-- Outer lens frame -->
  <rect x="28" y="118" width="304" height="164" rx="16" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <!-- Lens glass bg -->
  <rect x="30" y="120" width="300" height="160" rx="14" fill="#0a160a"/>
  <!-- Inner border (SDK border) -->
  <rect x="40" y="130" width="280" height="140" rx="6" fill="none" stroke="#2a5a2a" stroke-width="1.5"/>

  <!-- Now Playing content -->
  <g fill="#7fff7f" font-size="10.5" filter="url(#glow)">
    <text x="54" y="150">♪ Now Playing</text>
    <text x="54" y="163" fill="#2d7a2d">──────────────────────</text>
    <text x="54" y="177">Blinding Lights</text>
    <text x="54" y="190" fill="#5fdf5f">The Weeknd</text>
    <text x="54" y="210" fill="#9fff9f">▶ Playing</text>
    <text x="54" y="230" fill="#4a8a4a" font-size="9">Tap→Playlists  D-Tap→Play/Pause</text>
    <text x="54" y="243" fill="#4a8a4a" font-size="9">↑ Prev Track   ↓ Next Track</text>
  </g>

  <!-- Gesture icons under screen 1 -->
  <g fill="#555" font-size="9.5" text-anchor="middle">
    <text x="90"  y="305">TAP</text>
    <text x="180" y="305">D-TAP</text>
    <text x="270" y="305">↑ / ↓</text>
    <text x="90"  y="318" fill="#3a7a3a">→ Playlists</text>
    <text x="180" y="318" fill="#3a7a3a">Play/Pause</text>
    <text x="270" y="318" fill="#3a7a3a">Prev/Next</text>
  </g>

  <!-- ═══════════════════ SCREEN 2: PLAYLISTS ═══════════════════ -->
  <!-- Label -->
  <text x="550" y="100" text-anchor="middle" fill="#7fff7f" font-size="13" font-weight="bold">PLAYLIST BROWSER</text>

  <!-- Outer lens frame -->
  <rect x="398" y="118" width="304" height="164" rx="16" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <!-- Lens glass bg -->
  <rect x="400" y="120" width="300" height="160" rx="14" fill="#0a160a"/>
  <!-- Inner border -->
  <rect x="410" y="130" width="280" height="140" rx="6" fill="none" stroke="#2a5a2a" stroke-width="1.5"/>

  <!-- Playlists content -->
  <g fill="#7fff7f" font-size="10.5" filter="url(#glow)">
    <text x="422" y="150">Playlists</text>
    <text x="422" y="163" fill="#2d7a2d">──────────────────────</text>
    <!-- Highlighted row -->
    <rect x="418" y="166" width="264" height="13" fill="#1a3a1a" rx="2"/>
    <text x="422" y="177">▶ Discover Weekly</text>
    <text x="422" y="190" fill="#5fdf5f">  Liked Songs</text>
    <text x="422" y="203" fill="#5fdf5f">  Chill Vibes</text>
    <text x="422" y="216" fill="#5fdf5f">  Rock Classics</text>
    <text x="422" y="229" fill="#5fdf5f">  Morning Mix</text>
    <text x="422" y="238" fill="#2d6a2d" font-size="9">  1–5 of 12</text>
    <text x="422" y="251" fill="#4a8a4a" font-size="9">Tap→Open  D-Tap→Back  ↑↓ Move</text>
  </g>

  <!-- Gesture icons under screen 2 -->
  <g fill="#555" font-size="9.5" text-anchor="middle">
    <text x="460"  y="305">TAP</text>
    <text x="550"  y="305">D-TAP</text>
    <text x="640"  y="305">↑ / ↓</text>
    <text x="460"  y="318" fill="#3a7a3a">→ Tracks</text>
    <text x="550"  y="318" fill="#3a7a3a">← Now Playing</text>
    <text x="640"  y="318" fill="#3a7a3a">Scroll list</text>
  </g>

  <!-- ═══════════════════ SCREEN 3: TRACKS ═══════════════════ -->
  <!-- Label -->
  <text x="920" y="100" text-anchor="middle" fill="#7fff7f" font-size="13" font-weight="bold">TRACK BROWSER</text>

  <!-- Outer lens frame -->
  <rect x="768" y="118" width="304" height="164" rx="16" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <!-- Lens glass bg -->
  <rect x="770" y="120" width="300" height="160" rx="14" fill="#0a160a"/>
  <!-- Inner border -->
  <rect x="780" y="130" width="280" height="140" rx="6" fill="none" stroke="#2a5a2a" stroke-width="1.5"/>

  <!-- Tracks content -->
  <g fill="#7fff7f" font-size="10.5" filter="url(#glow)">
    <text x="792" y="150">Discover Weekly</text>
    <text x="792" y="163" fill="#2d7a2d">──────────────────────</text>
    <text x="792" y="177" fill="#5fdf5f">  Starboy</text>
    <text x="792" y="190" fill="#5fdf5f">  Save Your Tears</text>
    <!-- Highlighted row -->
    <rect x="788" y="192" width="264" height="13" fill="#1a3a1a" rx="2"/>
    <text x="792" y="203">▶ After Hours</text>
    <text x="792" y="216" fill="#5fdf5f">  Die For You</text>
    <text x="792" y="229" fill="#5fdf5f">  Sacrifice</text>
    <text x="792" y="238" fill="#2d6a2d" font-size="9">  1–5 of 24</text>
    <text x="792" y="251" fill="#4a8a4a" font-size="9">Tap→Play  D-Tap→Back  ↑↓ Move</text>
  </g>

  <!-- Gesture icons under screen 3 -->
  <g fill="#555" font-size="9.5" text-anchor="middle">
    <text x="830"  y="305">TAP</text>
    <text x="920"  y="305">D-TAP</text>
    <text x="1010" y="305">↑ / ↓</text>
    <text x="830"  y="318" fill="#3a7a3a">Play track</text>
    <text x="920"  y="318" fill="#3a7a3a">← Playlists</text>
    <text x="1010" y="318" fill="#3a7a3a">Scroll list</text>
  </g>

  <!-- ═══════════════════ NAVIGATION ARROWS ═══════════════════ -->
  <!-- Arrow: Now Playing → Playlists (tap) -->
  <g fill="#3a7a3a" stroke="#3a7a3a">
    <line x1="334" y1="200" x2="396" y2="200" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="396,196 404,200 396,204"/>
    <text x="365" y="194" text-anchor="middle" fill="#3a7a3a" font-size="9">TAP</text>
  </g>

  <!-- Arrow: Playlists → Tracks (tap) -->
  <g fill="#3a7a3a" stroke="#3a7a3a">
    <line x1="704" y1="200" x2="766" y2="200" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="766,196 774,200 766,204"/>
    <text x="735" y="194" text-anchor="middle" fill="#3a7a3a" font-size="9">TAP</text>
  </g>

  <!-- Arrow: Playlists ← Now Playing (d-tap, above) -->
  <g fill="#555" stroke="#555">
    <line x1="396" y1="175" x2="334" y2="175" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="334,171 326,175 334,179"/>
    <text x="365" y="170" text-anchor="middle" fill="#555" font-size="8">D-TAP</text>
  </g>

  <!-- Arrow: Tracks → Now Playing (play, long arc) -->
  <path d="M 920 118 Q 920 78 550 78 Q 180 78 180 118"
        fill="none" stroke="#7fff7f" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="176,118 180,108 184,118" fill="#7fff7f"/>
  <text x="550" y="72" text-anchor="middle" fill="#7fff7f" font-size="9" filter="url(#glow)">TAP (play track) → returns to Now Playing</text>

  <!-- Arrow: Tracks ← Playlists (d-tap, above) -->
  <g fill="#555" stroke="#555">
    <line x1="766" y1="175" x2="704" y2="175" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="704,171 696,175 704,179"/>
    <text x="735" y="170" text-anchor="middle" fill="#555" font-size="8">D-TAP</text>
  </g>

  <!-- ═══════════════════ AUTH SCREEN (small, bottom) ═══════════════════ -->
  <text x="550" y="365" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">AUTH SCREEN (first run only)</text>

  <rect x="345" y="378" width="410" height="110" rx="10" fill="#0a100a" stroke="#2a3a2a" stroke-width="1.5"/>
  <g fill="#4aaa4a" font-size="10" filter="url(#glow)">
    <text x="362" y="398">♪ Spotify G2</text>
    <text x="362" y="411" fill="#2a5a2a">──────────────────────────────</text>
    <text x="362" y="424">Not connected to Spotify.</text>
    <text x="362" y="440">Open in your browser:</text>
    <text x="362" y="453" fill="#7fff7f">localhost:3001/auth/login</text>
    <text x="362" y="469" fill="#2a7a2a">Then tap glasses to refresh.</text>
  </g>

  <!-- ═══════════════════ SETUP FLOW (bottom) ═══════════════════ -->
  <text x="550" y="522" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">SETUP FLOW</text>

  <g font-size="10" text-anchor="middle">
    <!-- Step boxes -->
    <rect x="30"  y="535" width="140" height="42" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="200" y="535" width="140" height="42" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="370" y="535" width="140" height="42" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="540" y="535" width="140" height="42" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="710" y="535" width="160" height="42" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>
    <rect x="900" y="535" width="168" height="42" rx="6" fill="#111" stroke="#2a4a2a" stroke-width="1"/>

    <text x="100"  y="552" fill="#5fdf5f">1. Spotify Dev</text>
    <text x="100"  y="566" fill="#4a8a4a">get credentials</text>

    <text x="270"  y="552" fill="#5fdf5f">2. cp .env.example</text>
    <text x="270"  y="566" fill="#4a8a4a">fill CLIENT_ID/SECRET</text>

    <text x="440"  y="552" fill="#5fdf5f">3. npm install</text>
    <text x="440"  y="566" fill="#4a8a4a">npm run dev</text>

    <text x="610"  y="552" fill="#5fdf5f">4. Open browser</text>
    <text x="610"  y="566" fill="#4a8a4a">localhost:3001/auth/login</text>

    <text x="790"  y="552" fill="#5fdf5f">5. npm run qr</text>
    <text x="790"  y="566" fill="#4a8a4a">scan with Even Hub app</text>

    <text x="984"  y="552" fill="#7fff7f">6. Enjoy ♪</text>
    <text x="984"  y="566" fill="#4a8a4a">Spotify on your glasses</text>

    <!-- Step arrows -->
    <line x1="172" y1="556" x2="198" y2="556" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="198,552 206,556 198,560" fill="#2a5a2a"/>
    <line x1="342" y1="556" x2="368" y2="556" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="368,552 376,556 368,560" fill="#2a5a2a"/>
    <line x1="512" y1="556" x2="538" y2="556" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="538,552 546,556 538,560" fill="#2a5a2a"/>
    <line x1="682" y1="556" x2="708" y2="556" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="708,552 716,556 708,560" fill="#2a5a2a"/>
    <line x1="872" y1="556" x2="898" y2="556" stroke="#2a5a2a" stroke-width="1.5"/>
    <polygon points="898,552 906,556 898,560" fill="#2a5a2a"/>
  </g>
</svg>
