<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spotify G2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    #app { max-width: 430px; margin: 0 auto; min-height: 100dvh; }

    .view { display: none; flex-direction: column; min-height: 100dvh; }
    .view.active { display: flex; }

    /* ── Auth ─────────────────────────────────────────── */
    .auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px 32px;
      text-align: center;
    }

    .auth-logo {
      width: 88px;
      height: 88px;
      background: #1db954;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }

    .auth-sub {
      font-size: 15px;
      color: #b3b3b3;
      line-height: 1.6;
      max-width: 280px;
    }

    .btn-connect {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1db954;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.3px;
      margin-top: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-connect:active { background: #1ed760; transform: scale(0.97); }

    /* ── Header ───────────────────────────────────────── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #2a2a2a;
      position: sticky;
      top: 0;
      background: #121212;
      z-index: 10;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
    }
    .header-logo svg { width: 20px; height: 20px; fill: #1db954; }

    .conn-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #b3b3b3;
    }
    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #535353;
    }
    .conn-dot.on { background: #1db954; box-shadow: 0 0 6px #1db954aa; }

    /* ── Now Playing ──────────────────────────────────── */
    .now-playing {
      padding: 28px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .album-art {
      width: 100%;
      max-width: 272px;
      aspect-ratio: 1;
      border-radius: 10px;
      background: #282828;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      position: relative;
    }
    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      position: absolute;
      inset: 0;
    }
    .album-art img.loaded { display: block; }
    .album-placeholder { font-size: 72px; opacity: 0.25; }

    .track-info { width: 100%; text-align: center; }
    .track-name {
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }
    .artist-name {
      font-size: 14px;
      color: #b3b3b3;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress */
    .progress-wrap { width: 100%; }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #535353;
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      background: #b3b3b3;
      border-radius: 2px;
      width: 0%;
      transition: width 1s linear;
    }
    .progress-bar:hover .progress-fill { background: #1db954; }
    .progress-times {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 11px;
      color: #b3b3b3;
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, transform 0.1s;
    }
    .ctrl-btn:hover { color: #fff; }
    .ctrl-btn:active { transform: scale(0.88); }
    .ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .ctrl-btn:disabled:active { transform: none; }
    .ctrl-btn svg { width: 26px; height: 26px; fill: currentColor; }

    .ctrl-btn--play {
      width: 56px;
      height: 56px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      padding: 0;
    }
    .ctrl-btn--play:hover { background: #fff; color: #000; transform: scale(1.05); }
    .ctrl-btn--play:active { transform: scale(0.95); }
    .ctrl-btn--play:disabled { background: #535353; }
    .ctrl-btn--play svg { width: 22px; height: 22px; }

    /* ── Playlists ─────────────────────────────────────── */
    .section-title {
      padding: 4px 20px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #b3b3b3;
      text-transform: uppercase;
    }

    .playlist-list {
      padding: 0 12px 32px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .playlist-item:hover  { background: #282828; }
    .playlist-item:active { background: #333; }

    .pl-thumb {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      background: #333;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #666;
      overflow: hidden;
    }
    .pl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .pl-info { flex: 1; overflow: hidden; }
    .pl-name {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pl-meta { font-size: 13px; color: #b3b3b3; margin-top: 2px; }

    /* ── Tracks view ──────────────────────────────────── */
    .tracks-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a2a;
      position: sticky;
      top: 0;
      background: #121212;
      z-index: 10;
    }

    .btn-back {
      background: none;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      padding: 4px 8px 4px 0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .btn-back:hover { color: #fff; }
    .btn-back svg { width: 22px; height: 22px; fill: currentColor; display: block; }

    .tracks-title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-list {
      padding: 8px 12px 32px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      flex: 1;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .track-item:hover  { background: #282828; }
    .track-item:active { background: #333; }
    .track-item.playing .track-item-name { color: #1db954; }

    .track-num {
      width: 28px;
      text-align: center;
      font-size: 13px;
      color: #b3b3b3;
      flex-shrink: 0;
    }
    .track-item.playing .track-num { color: #1db954; }

    .track-item-info { flex: 1; overflow: hidden; }
    .track-item-name {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-item-artist {
      font-size: 13px;
      color: #b3b3b3;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-dur { font-size: 13px; color: #b3b3b3; flex-shrink: 0; }

    /* ── Utility ──────────────────────────────────────── */
    .placeholder-msg {
      text-align: center;
      color: #b3b3b3;
      font-size: 14px;
      padding: 32px 20px;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Auth view ── -->
  <div class="view" id="view-auth">
    <div class="auth-screen">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="#000">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
      </div>
      <h1 class="auth-title">Spotify G2</h1>
      <p class="auth-sub">Connect your Spotify account to control music on your Even Realities G2 glasses.</p>
      <a href="/auth/login" class="btn-connect">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        Connect Spotify
      </a>
    </div>
  </div>

  <!-- ── Main view ── -->
  <div class="view" id="view-main">
    <header class="app-header">
      <div class="header-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        Spotify G2
      </div>
      <div class="conn-badge">
        <div class="conn-dot on" id="conn-dot"></div>
        <span id="conn-label">Connected</span>
      </div>
    </header>

    <div style="overflow-y:auto; flex:1;">
      <!-- Now Playing card -->
      <section class="now-playing">
        <div class="album-art" id="album-art">
          <img id="album-img" src="" alt="Album art" />
          <div class="album-placeholder" id="album-placeholder">♪</div>
        </div>

        <div class="track-info">
          <div class="track-name" id="track-name">—</div>
          <div class="artist-name" id="artist-name">—</div>
        </div>

        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-times">
            <span id="progress-current">0:00</span>
            <span id="progress-total">0:00</span>
          </div>
        </div>

        <div class="controls">
          <!-- Previous -->
          <button class="ctrl-btn" id="btn-prev" aria-label="Previous" disabled>
            <svg viewBox="0 0 16 16"><path d="M13 2.5L5 7.119V2.5H3v11h2V8.881l8 4.619V2.5z"/></svg>
          </button>

          <!-- Play / Pause -->
          <button class="ctrl-btn ctrl-btn--play" id="btn-play" aria-label="Play / Pause" disabled>
            <svg id="icon-play" viewBox="0 0 16 16">
              <path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"/>
            </svg>
            <svg id="icon-pause" viewBox="0 0 16 16" style="display:none">
              <path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/>
            </svg>
          </button>

          <!-- Next -->
          <button class="ctrl-btn" id="btn-next" aria-label="Next" disabled>
            <svg viewBox="0 0 16 16"><path d="M3 13.5l8-4.619V13.5h2v-11h-2v4.619L3 2.5v11z"/></svg>
          </button>
        </div>
      </section>

      <!-- Playlists -->
      <div class="section-title">My Playlists</div>
      <div class="playlist-list" id="playlist-list">
        <div class="placeholder-msg">Loading playlists…</div>
      </div>
    </div>
  </div>

  <!-- ── Tracks view ── -->
  <div class="view" id="view-tracks">
    <div class="tracks-header">
      <button class="btn-back" id="btn-back" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="tracks-title" id="tracks-title">Playlist</div>
    </div>
    <div class="track-list" id="track-list"></div>
  </div>

</div>

<!-- Glasses bridge (invisible) -->
<script type="module" src="/src/main.ts"></script>
<!-- Companion web UI -->
<script type="module" src="/src/ui.ts"></script>
</body>
</html>
